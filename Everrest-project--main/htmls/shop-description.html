<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shop description</title>
    <link rel="stylesheet" href="../css/shop-description.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav id="navbar">
      <div class="left">
        <div id="logo"><a href="./shop.html">Shop</a></div>
      </div>
      <div class="right">
        <a href="./cart.html" id="cart"
          ><i class="fa-solid fa-cart-shopping"></i
        ></a>
        <a href="../index.html"> Home </a>
      </div>
    </nav>
    <main>
      <section>
        <div id="product-page">
          <div id="gallery">
            <img id="main-image" src="" alt="" />
            <div id="thumbnails"></div>
          </div>

          <div id="info">
            <p id="brand"></p>
            <p id="category"></p>
            <h1 id="title"></h1>
            <p id="description"></p>

            <div id="price">
              <span id="current-price"></span>
              <span id="before-discount"></span>
              <span id="discount-badge"></span>
            </div>

            <div id="rating">
              <span id="rating-value"></span>
              <span id="rating-count"></span>
            </div>

            <div id="stock"></div>
            <div id="warranty"></div>
            <div id="cart-controls"></div>
          </div>
          <div class="rate-comments"></div>
        </div>
      </section>
    </main>
    <footer>
      <div class="footer-left">EVER<span>REST</span> © 2025</div>
      <div class="footer-right">
        Built with intention — Powered by everrest.webscaffold.io
      </div>
    </footer>
    <script src="../jss/shop-pageDesc.js"></script>
  </body>
</html>
